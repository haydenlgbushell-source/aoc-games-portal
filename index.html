  ╔══════════════════════════════════════════════════════════════════════════╗
  ║  AOC GAMES PORTAL — Self-Contained SharePoint Build                     ║
  ╠══════════════════════════════════════════════════════════════════════════╣
  ║  SHAREPOINT DEPLOYMENT (3 steps):                                       ║
  ║                                                                          ║
  ║  1. Upload this file to SharePoint                                       ║
  ║     Site Contents → Site Assets → Upload → select this file             ║
  ║                                                                          ║
  ║  2. Get the file URL                                                     ║
  ║     In Site Assets, right-click the file → Copy link                    ║
  ║     The URL looks like: https://yourtenant.sharepoint.com/sites/...     ║
  ║                                                                          ║
  ║  3a. Full-page experience (recommended)                                  ║
  ║     Paste the URL directly in a browser tab — it renders as a page.     ║
  ║     Share that URL as a Teams tab, bookmark, or SharePoint Quick Link.  ║
  ║                                                                          ║
  ║  3b. Embedded in a SharePoint page                                       ║
  ║     Edit page → + Add web part → Embed → paste the URL                  ║
  ║     Set height to ~920 px and width to Full Width                        ║
  ║                                                                          ║
  ║  AI CHAT: Uses a built-in response system (no API key required).         ║
  ║  To connect to a live Claude API, update window.claude.complete below.  ║
  ╚══════════════════════════════════════════════════════════════════════════╝
-->

<!-- ── AI Configuration ──────────────────────────────────────────────────────
     Built-in keyword responses — no API key required.
     To connect a live Claude API, replace this block with your endpoint call.
     The function receives { messages: [{role, content}] } and must return a
     Promise<string>.
──────────────────────────────────────────────────────────────────────────── -->
<script>
window.claude = {
  complete: async function({ messages }) {
    var q = ((messages[0] && messages[0].content) || '').toLowerCase();
    await new Promise(function(r){ setTimeout(r, 500 + Math.random() * 400); });
    if (q.includes('deadline') || q.includes('owe') || q.includes('due') || q.includes('this week'))
      return "Check the Deadline card on the Home tab — it shows your nearest upcoming date with a day-count. For the full action list, open your section and look for items tagged 'Action required'.";
    if (q.includes('news') || q.includes('announcement') || q.includes('latest') || q.includes('summarise') || q.includes('summary'))
      return "The News & Announcements panel on the Home tab shows the latest updates filtered to your role. Hit 'View all' for the complete list. You can also switch Games using the top-bar selector to see what's moving on LA28.";
    if (q.includes('contact') || q.includes('who is') || q.includes('find'))
      return "Use Quick links → Contact Directory on the Home page, or the sidebar General → Contact Directory. For role-specific contacts, check the relevant section (e.g. Travel for transport leads, Polyclinic for medical staff).";
    if (q.includes('quota') || q.includes('matrix') || q.includes('athletics'))
      return "The latest quota updates are in Competition Info. Look for 'Athletics quota matrix v3.xlsx' — uploaded by Maya Toleafoa 14 min ago. Four events were revised; check the changelog tab in the spreadsheet.";
    if (q.includes('travel') || q.includes('flight') || q.includes('itinerary') || q.includes('pickup'))
      return "Travel documents are in the Travel section. The pickup window for Team A was recently updated — check your itinerary for the revised time. Raise issues via Quick links → Submit a request.";
    if (q.includes('transport') || q.includes('bus') || q.includes('loop'))
      return "The draft bus loop schedule is under Transport — feedback is due by Friday. The Logistics bot updated it on Apr 28; look for 'Bus loop schedule (draft)' and add comments directly in the document.";
    if (q.includes('medical') || q.includes('polyclinic') || q.includes('intake') || q.includes('athlete form'))
      return "Polyclinic intake forms (v3) are now published under Medical → Athlete Forms. The deadline for submission is today (08 May). Contact Dr. R. Naidu if you have questions about specific athlete requirements.";
    if (q.includes('ticket') || q.includes('allocation') || q.includes('family'))
      return "The family bloc allocation portal opens 9 May — see Ticketing → Family & Friends. Final family ticket counts are due 11 May. Check Allocations for your current allotment before submitting.";
    if (q.includes('village') || q.includes('accom') || q.includes('diamniadio'))
      return "The Diamniadio Olympic Village walkthrough video is now live under Village & Accom. Room assignments and check-in procedures are in the same section — check for the updated v2 documents.";
    if (q.includes('section') || q.includes('access') || q.includes('what can i see'))
      return "Your sections are shown in the sidebar on the left and as cards on the Home tab. Click any section card to navigate into it. Your current role controls which sections are visible — use the Demo bar to preview other role views.";
    return "I'm the AOC Games Portal assistant for " + (messages[0] && messages[0].content && messages[0].content.includes('LA28') ? 'Los Angeles 2028' : 'Dakar 2026') + ". Try asking about deadlines, latest news, travel, contacts, the village, or specific sections like Competition Info, Medical, or Ticketing.";
  }
};
</script>

<!-- ── tweaks-panel.jsx ──────────────────────────────────────────────────── -->
<script type="text/babel">
function useTweaks(defaults) {
  const [state, setState] = React.useState(defaults);
  const set = (key, val) => setState(s => ({ ...s, [key]: val }));
  return [state, set];
}

function TweaksPanel({ title, children }) {
  const [open, setOpen] = React.useState(false);
  return (
    <div style={{ position:'fixed', bottom:24, left:24, zIndex:50 }}>
      {open && (
        <div style={{
          background:'#fff', border:'1px solid var(--ink-200)',
          borderRadius:14, boxShadow:'var(--shadow-lg)',
          padding:'16px 18px', marginBottom:10, minWidth:264,
        }}>
          <div className="mono" style={{
            fontSize:10.5, letterSpacing:'.14em', textTransform:'uppercase',
            color:'var(--ink-400)', marginBottom:14,
          }}>{title}</div>
          <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
            {children}
          </div>
        </div>
      )}
      <button
        onClick={() => setOpen(o => !o)}
        style={{
          appearance:'none', border:'1px solid var(--ink-200)',
          background:'#fff', cursor:'pointer',
          padding:'7px 14px', borderRadius:9,
          fontFamily:'inherit', fontSize:12.5, fontWeight:500,
          color:'var(--ink-700)', display:'inline-flex', alignItems:'center', gap:6,
          boxShadow:'var(--shadow-sm)',
        }}
      >
        <Icon name="cog" size={14}/> {open ? 'Close tweaks' : 'Tweaks'}
      </button>
    </div>
  );
}

function TweakSection({ label }) {
  return (
    <div className="mono" style={{
      fontSize:10.5, letterSpacing:'.12em', textTransform:'uppercase',
      color:'var(--ink-400)', marginTop:6,
    }}>{label}</div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:8 }}>
      <span style={{ fontSize:13, color:'var(--ink-700)' }}>{label}</span>
      <input type="color" value={value} onChange={e => onChange(e.target.value)}
        style={{ width:32, height:24, border:'1px solid var(--ink-200)', borderRadius:5, cursor:'pointer', padding:2 }}
      />
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  return (
    <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:8 }}>
      <span style={{ fontSize:13, color:'var(--ink-700)', flex:'0 0 auto' }}>{label}</span>
      <div style={{ display:'flex', gap:4 }}>
        {options.map(o => (
          <button key={o} onClick={() => onChange(o)} style={{
            appearance:'none', cursor:'pointer', fontFamily:'inherit',
            border:'1px solid var(--ink-200)', borderRadius:6,
            padding:'3px 8px', fontSize:12,
            background: value === o ? 'var(--teal-700)' : '#fff',
            color:      value === o ? '#fff'            : 'var(--ink-700)',
            fontWeight: value === o ? 600               : 400,
            transition:'background .1s',
          }}>{o}</button>
        ))}
      </div>
    </div>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:8 }}>
      <span style={{ fontSize:13, color:'var(--ink-700)' }}>{label}</span>
      <button onClick={() => onChange(!value)} style={{
        appearance:'none', cursor:'pointer',
        width:38, height:22, borderRadius:999, border:0,
        background: value ? 'var(--teal-700)' : 'var(--ink-300)',
        position:'relative', transition:'background .15s',
      }}>
        <span style={{
          position:'absolute', top:2,
          left: value ? 18 : 2,
          width:18, height:18, borderRadius:'50%',
          background:'#fff', transition:'left .15s',
        }}/>
      </button>
    </div>
  );
}

window.useTweaks = useTweaks;
window.TweaksPanel = TweaksPanel;
window.TweakSection = TweakSection;
window.TweakColor = TweakColor;
window.TweakRadio = TweakRadio;
window.TweakToggle = TweakToggle;
</script>

<!-- ── icons.jsx ────────────────────────────────────────────────────────── -->
<script type="text/babel">
const Icon = ({ name, size = 18, stroke = 1.6, style }) => {
  const s = size, sw = stroke;
  const common = { width:s, height:s, viewBox:'0 0 24 24', fill:'none',
                   stroke:'currentColor', strokeWidth:sw, strokeLinecap:'round',
                   strokeLinejoin:'round', style };
  switch (name) {
    case 'medal':   return <svg {...common}><circle cx="12" cy="15" r="5"/><path d="M8 4l3 6M16 4l-3 6M7 4h10"/></svg>;
    case 'plane':   return <svg {...common}><path d="M3 12l8-1 4-7 2 1-2 7 6 3 1 2-7 0-2 5-2 1-1-5-7-1z"/></svg>;
    case 'home':    return <svg {...common}><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>;
    case 'camera':  return <svg {...common}><rect x="3" y="6" width="18" height="13" rx="2"/><circle cx="12" cy="13" r="4"/><path d="M8 6l2-2h4l2 2"/></svg>;
    case 'doc':     return <svg {...common}><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M8 13h8M8 17h6"/></svg>;
    case 'phone':   return <svg {...common}><path d="M5 4h4l2 5-2 1a12 12 0 0 0 5 5l1-2 5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>;
    case 'user':    return <svg {...common}><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>;
    case 'users':   return <svg {...common}><circle cx="9" cy="8" r="3.5"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 11a3 3 0 0 0 0-6"/><path d="M17 20a5 5 0 0 0 4-4.5"/></svg>;
    case 'bell':    return <svg {...common}><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2H4.5z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>;
    case 'search':  return <svg {...common}><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>;
    case 'bolt':    return <svg {...common}><path d="M13 3l-7 11h5l-1 7 7-11h-5z"/></svg>;
    case 'clock':   return <svg {...common}><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>;
    case 'check':   return <svg {...common}><path d="M5 12l4 4 10-10"/></svg>;
    case 'arrow':   return <svg {...common}><path d="M5 12h14M13 6l6 6-6 6"/></svg>;
    case 'pin':     return <svg {...common}><path d="M12 2l4 6 5 1-4 4 1 6-6-3-6 3 1-6-4-4 5-1z"/></svg>;
    case 'plus':    return <svg {...common}><path d="M12 5v14M5 12h14"/></svg>;
    case 'cog':     return <svg {...common}><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.5-2.4.8a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.4a7 7 0 0 0-2 1.2L5 5.8 3 9.3l2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.5 2.4-.8a7 7 0 0 0 2 1.2L10 21h4l.5-2.4a7 7 0 0 0 2-1.2l2.4.8 2-3.5-2-1.5c0-.4.1-.8.1-1.2z"/></svg>;
    case 'menu':    return <svg {...common}><path d="M4 7h16M4 12h16M4 17h16"/></svg>;
    case 'chev-down':  return <svg {...common}><path d="M6 9l6 6 6-6"/></svg>;
    case 'chev-right': return <svg {...common}><path d="M9 6l6 6-6 6"/></svg>;
    case 'flag':    return <svg {...common}><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>;
    case 'cal':     return <svg {...common}><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>;
    case 'star':    return <svg {...common}><path d="M12 3l2.7 5.6 6.3.9-4.5 4.4 1.1 6.2L12 17l-5.6 3 1.1-6.2L3 9.5l6.3-.9z"/></svg>;
    case 'ticket':  return <svg {...common}><path d="M3 9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/><path d="M14 7v10" strokeDasharray="2 2"/></svg>;
    case 'cross':   return <svg {...common}><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg>;
    case 'shield':  return <svg {...common}><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>;
    case 'heart':   return <svg {...common}><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>;
    case 'bus':     return <svg {...common}><rect x="4" y="5" width="16" height="12" rx="2"/><path d="M4 11h16M8 17v2M16 17v2"/><circle cx="8" cy="14" r="1"/><circle cx="16" cy="14" r="1"/></svg>;
    case 'fork':    return <svg {...common}><path d="M7 3v7a3 3 0 0 0 6 0V3M10 13v8M17 3c-1.5 0-2 2-2 5s.5 5 2 5v8"/></svg>;
    case 'pen':     return <svg {...common}><path d="M4 20l4-1L19 8l-3-3L5 16z"/></svg>;
    case 'palette': return <svg {...common}><path d="M12 3a9 9 0 1 0 0 18 2 2 0 0 0 1.5-3.5A1.5 1.5 0 0 1 14.5 15H17a4 4 0 0 0 4-4 8 8 0 0 0-9-8z"/><circle cx="7.5" cy="11" r="1"/><circle cx="9.5" cy="7" r="1"/><circle cx="14.5" cy="7" r="1"/></svg>;
    case 'q':       return <svg {...common}><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2.5 2-2.5 4M12 17h.01"/></svg>;
    case 'logo':    return (
      <svg width={size} height={size} viewBox="0 0 32 32" fill="none" style={style}>
        <circle cx="11" cy="16" r="6.2" stroke="currentColor" strokeWidth="2"/>
        <circle cx="16" cy="16" r="6.2" stroke="currentColor" strokeWidth="2"/>
        <circle cx="21" cy="16" r="6.2" stroke="currentColor" strokeWidth="2"/>
      </svg>
    );
    default:        return <svg {...common}><circle cx="12" cy="12" r="8"/></svg>;
  }
};

window.Icon = Icon;
</script>

function Avatar({ name, size = 32, tone = 'gold' }) {

      display:'inline-flex',alignItems:'center',justifyContent:'center',

      background:t.bg,color:t.fg,fontWeight:600,

function SearchSuggestions({ query }) {
  const filtered = (query
    ? SEARCH_SUGGESTIONS.filter(s => s.label.toLowerCase().includes(query.toLowerCase()))

    <div style={{

        <div style={{padding:'18px 14px',color:'var(--ink-500)',fontSize:13}}>

            <div style={{fontSize:13.5,fontWeight:500}}>{s.label}</div>
            <div style={{fontSize:12,color:'var(--ink-500)'}}>{s.meta}</div>

              onMouseEnter={e => { if (!active) e.currentTarget.style.background = 'var(--ink-50)'; }}

                <span style={{color: active ? 'var(--teal-700)' : 'var(--ink-500)', flex:'0 0 auto'}}>

                    color: isPinned ? 'var(--gold-500)' : 'var(--ink-300)',
                    display:'inline-flex', padding:2, cursor:'pointer',

                  title={isPinned ? 'Unpin' : 'Pin'}>

            </button>

      <div style={{
        marginTop:24, padding:14, borderRadius:12,

        border:'1px solid rgba(21,82,81,.18)',
      }}>

              Pin sections, draft requests offline, redesigned Resources tab.
            </div>
          </div>
        </div>
      </div>

<script type="text/babel">
function AskAOC({ gamesName, role, roleLabel }) {
  const [open, setOpen] = React.useState(false);
  const [pulse, setPulse] = React.useState(true);
  const [input, setInput] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const [messages, setMessages] = React.useState([
    { who:'ai', text:`Hi 👋 I'm the AOC assistant. Ask me anything about ${gamesName} — deadlines, sections, contacts, or "what do I owe this week?"` },
  ]);
  const scrollerRef = React.useRef(null);

  React.useEffect(() => {
    const el = scrollerRef.current;
    if (el) el.scrollTop = el.scrollHeight;
  }, [messages, open, busy]);

  React.useEffect(() => {
    setMessages([
      { who:'ai', text:`Now viewing as ${roleLabel} — ${gamesName}. Ask me anything about your sections, deadlines, or who to contact.` },
    ]);
  }, [gamesName, role]);

  React.useEffect(() => { if (open) setPulse(false); }, [open]);

  const suggestions = [
    'What deadlines do I have this week?',
    'Summarise the latest news for me',
    'Who is the contact for Travel?',
    'What changed in the quota matrix?',
  ];

  const send = async (text) => {
    const q = (text ?? input).trim();
    if (!q || busy) return;
    setInput('');
    setMessages(m => [...m, { who:'me', text:q }]);
    setBusy(true);
    try {
      const sys = `You are the AOC Games Portal assistant for the Australian Olympic Committee.
The user is viewing as: ${roleLabel}. Active Games: ${gamesName}.
Answer briefly and helpfully (max 4 sentences). Be specific to Games operations:
sections, documents, deadlines, contacts, quotas, transport, medical, ticketing.
If you don't know specifics, suggest where in the portal to look (e.g. "Competition Info → Quota matrix").`;
      const reply = await window.claude.complete({
        messages: [
          { role:'user', content: `${sys}\n\nUser question: ${q}` },
        ],
      });
      setMessages(m => [...m, { who:'ai', text: reply || '(no reply)' }]);
    } catch (e) {
      setMessages(m => [...m, { who:'ai', text:'Sorry — I had trouble reaching the assistant. Try again in a moment.' }]);
    } finally {
      setBusy(false);
    }
  };

  return (
    <>
      <button
        onClick={() => setOpen(o => !o)}
        aria-label="Ask the AOC"
        style={{
          position:'fixed', right:24, bottom:24, zIndex:40,
          width:60, height:60, borderRadius:'50%',
          appearance:'none', border:0, cursor:'pointer',
          background:'linear-gradient(135deg, var(--teal-700), var(--teal-900))',
          color:'#fff',
          boxShadow:'0 12px 30px -10px rgba(10,46,45,.55), 0 2px 6px rgba(10,46,45,.25)',
          display:'inline-flex', alignItems:'center', justifyContent:'center',
          transition:'transform .15s',
        }}
        onMouseEnter={e => e.currentTarget.style.transform = 'translateY(-2px)'}
        onMouseLeave={e => e.currentTarget.style.transform = 'none'}
      >
        {pulse && !open && (
          <span aria-hidden="true" style={{
            position:'absolute', inset:-4, borderRadius:'50%',
            border:'2px solid var(--gold-500)', opacity:.7,
            animation:'aocPulse 1.8s ease-out infinite',
          }}/>
        )}
        <span style={{
          position:'absolute', top:-3, right:-3,
          width:22, height:22, borderRadius:'50%',
          background:'var(--gold-500)', color:'var(--teal-900)',
          fontSize:11, fontWeight:700, letterSpacing:'-.01em',
          display:'inline-flex', alignItems:'center', justifyContent:'center',
          border:'2px solid var(--paper)',
        }}>AI</span>
        {open
          ? <Icon name="plus" size={22} style={{transform:'rotate(45deg)'}}/>
          : <AOCSparkle/>
        }
      </button>

      {open && (
        <div role="dialog" aria-label="Ask the AOC" style={{
          position:'fixed', right:24, bottom:96, zIndex:40,
          width:380, height:520, maxHeight:'calc(100vh - 120px)',
          background:'#fff',
          border:'1px solid var(--ink-200)',
          borderRadius:18, overflow:'hidden',
          boxShadow:'0 24px 60px -20px rgba(10,46,45,.35), 0 4px 14px rgba(10,46,45,.12)',
          display:'flex', flexDirection:'column',
          animation:'aocIn .2s cubic-bezier(.3,.7,.4,1)',
        }}>
          <header style={{
            background:'var(--teal-800)', color:'#fff',
            padding:'14px 16px',
            display:'flex', alignItems:'center', gap:12,
            borderBottom:'1px solid rgba(255,255,255,.08)',
          }}>
            <span style={{
              width:34, height:34, borderRadius:10,
              background:'var(--gold-500)', color:'var(--teal-900)',
              display:'inline-flex', alignItems:'center', justifyContent:'center',
            }}>
              <AOCSparkle size={18}/>
            </span>
            <div style={{lineHeight:1.2,minWidth:0,flex:1}}>
              <div style={{fontSize:14.5,fontWeight:600}}>Ask the AOC</div>
              <div style={{fontSize:11.5,color:'rgba(255,255,255,.65)'}}>
                <span style={{
                  display:'inline-block',width:6,height:6,borderRadius:'50%',
                  background:'#5fd09a',marginRight:6,verticalAlign:'middle',
                }}/>
                Online · {gamesName}
              </div>
            </div>
            <button onClick={() => setOpen(false)} aria-label="Close" style={{
              appearance:'none', border:0, cursor:'pointer',
              background:'rgba(255,255,255,.08)', color:'#fff',
              width:28, height:28, borderRadius:8,
              display:'inline-flex',alignItems:'center',justifyContent:'center',
            }}>
              <Icon name="plus" size={14} style={{transform:'rotate(45deg)'}}/>
            </button>
          </header>

          <div ref={scrollerRef} style={{
            flex:1, overflowY:'auto', padding:'16px 14px',
            background:'var(--paper)',
            display:'flex', flexDirection:'column', gap:10,
          }}>
            {messages.map((m, i) => <Bubble key={i} who={m.who} text={m.text}/>)}
            {busy && <Bubble who="ai" text={<TypingDots/>}/>}
          </div>

          {messages.length <= 1 && !busy && (
            <div style={{
              padding:'0 14px 10px', display:'flex', flexWrap:'wrap', gap:6,
              background:'var(--paper)',
            }}>
              {suggestions.map(s => (
                <button key={s} onClick={() => send(s)} style={{
                  appearance:'none', cursor:'pointer', fontFamily:'inherit',
                  border:'1px solid var(--ink-200)', background:'#fff',
                  padding:'6px 10px', borderRadius:999,
                  fontSize:11.5, color:'var(--ink-700)',
                }}>{s}</button>
              ))}
            </div>
          )}

          <form onSubmit={e => { e.preventDefault(); send(); }} style={{
            padding:'10px 12px',
            borderTop:'1px solid var(--ink-100)',
            background:'#fff',
            display:'flex', alignItems:'center', gap:8,
          }}>
            <input
              value={input}
              onChange={e => setInput(e.target.value)}
              placeholder="Ask anything about Games operations…"
              style={{
                flex:1, border:'1px solid var(--ink-200)', borderRadius:10,
                padding:'9px 12px', fontFamily:'inherit', fontSize:13.5,
                outline:0, color:'var(--ink-900)', background:'var(--paper)',
              }}
            />
            <button type="submit" disabled={busy || !input.trim()} style={{
              appearance:'none', border:0, cursor: busy ? 'wait' : 'pointer',
              background:'var(--teal-800)', color:'#fff',
              width:34, height:34, borderRadius:10,
              display:'inline-flex', alignItems:'center', justifyContent:'center',
              opacity: busy || !input.trim() ? .5 : 1,
              transition:'opacity .15s',
            }} aria-label="Send">
              <Icon name="arrow" size={16}/>
            </button>
          </form>

          <div className="mono" style={{
            padding:'6px 14px 10px', fontSize:10, color:'var(--ink-400)',
            letterSpacing:'.06em', textTransform:'uppercase', textAlign:'center',
            background:'#fff',
          }}>AI may be inaccurate · Verify with official sources</div>
        </div>
      )}

      <style>{`
        @keyframes aocPulse {
          0%   { transform: scale(1);   opacity:.7 }
          80%  { transform: scale(1.5); opacity:0  }
          100% { transform: scale(1.5); opacity:0  }
        }
        @keyframes aocIn {
          from { transform: translateY(10px) scale(.98); opacity:0 }
          to   { transform: translateY(0)    scale(1);   opacity:1 }
        }
        @keyframes aocDot {
          0%,80%,100% { opacity:.25; transform: translateY(0) }
          40%         { opacity:1;   transform: translateY(-2px) }
        }
      `}</style>
    </>
  );
}

function Bubble({ who, text }) {
  const me = who === 'me';
  return (
    <div style={{ display:'flex', justifyContent: me ? 'flex-end' : 'flex-start' }}>
      <div style={{
        maxWidth:'82%',
        background: me ? 'var(--teal-800)' : '#fff',
        color:    me ? '#fff'             : 'var(--ink-900)',
        border:   me ? 'none'             : '1px solid var(--ink-200)',
        padding:'9px 12px',
        borderRadius: me ? '14px 14px 4px 14px' : '14px 14px 14px 4px',
        fontSize:13.4, lineHeight:1.45,
        boxShadow: me ? 'none' : '0 1px 2px rgba(10,46,45,.04)',
        whiteSpace:'pre-wrap',
      }}>{text}</div>
    </div>
  );
}

function TypingDots() {
  const dot = (delay) => ({
    display:'inline-block', width:6, height:6, borderRadius:'50%',
    background:'var(--ink-400)', margin:'0 2px',
    animation:`aocDot 1.2s ${delay}s infinite`,
  });
  return (
    <span style={{display:'inline-flex',alignItems:'center',padding:'2px 0'}}>
      <span style={dot(0)}/><span style={dot(.15)}/><span style={dot(.3)}/>
    </span>
  );
}

function AOCSparkle({ size = 22 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
      <path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/>
      <path d="M19 14l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/>
    </svg>
  );
}

window.AskAOC = AskAOC;
</script>

<!-- ── app.jsx ───────────────────────────────────────────────────────────── -->
<script type="text/babel">
const TWEAK_DEFAULTS = {
  "accent": "#f5b81f",
  "density": "regular",
  "heroVariant": "gradient",
  "showShortcuts": true,
  "showActivity": true,
  "darkChrome": true
};

const NOTIFS_BY_GAMES = {
  da26: [
    { tag:'Competition', time:'2 h ago', title:'Athletics quotas revised — 4 events updated' },
    { tag:'Travel',      time:'5 h ago', title:'Itinerary for Team A — pickup window changed' },
    { tag:'Medical',     time:'1 d ago', title:'Polyclinic intake forms (v3) published' },
    { tag:'Village',     time:'1 d ago', title:'Diamniadio Olympic Village walkthrough now live' },
    { tag:'Mention',     time:'2 d ago', title:'Maya T. mentioned you in "Quota matrix v3"' },
  ],
  la28: [
    { tag:'Qualification', time:'4 h ago', title:'LA28 sport-entry standards — first draft circulated' },
    { tag:'Village',       time:'1 d ago', title:'UCLA Village layout v2 — feedback window open' },
    { tag:'Medical',       time:'1 d ago', title:'Heat policy consultation — comments due 26 May' },
    { tag:'Sustainability',time:'2 d ago', title:'No-new-venue strategy — supplier briefing 12 May' },
    { tag:'Mention',       time:'3 d ago', title:'Kemueli V. mentioned you in "UCLA Village"' },
  ],
};

function GamesSwitcher({ games, current, onChange }) {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  React.useEffect(() => {
    const onDoc = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, []);
  const cur = games.find(g => g.id === current);
  return (
    <div ref={ref} style={{position:'relative'}}>
      <button onClick={() => setOpen(o => !o)} style={{
        appearance:'none', border:0, cursor:'pointer',
        background:'rgba(255,255,255,.07)', color:'#fff',
        padding:'6px 10px 6px 8px', borderRadius:8,
        display:'inline-flex', alignItems:'center', gap:8,
        fontFamily:'inherit', fontSize:12.5, fontWeight:500,
      }}>
        <span style={{
          width:22,height:22,borderRadius:6,
          background:'rgba(255,255,255,.1)',
          display:'inline-flex',alignItems:'center',justifyContent:'center',
          fontSize:13,
        }}>{cur.flag}</span>
        <span style={{display:'flex',flexDirection:'column',lineHeight:1.1,textAlign:'left'}}>
          <span className="mono" style={{fontSize:9.5,letterSpacing:'.14em',color:'rgba(255,255,255,.55)',textTransform:'uppercase'}}>Games</span>
          <span style={{fontWeight:600}}>{cur.code}</span>
        </span>
        <Icon name="chev-down" size={14} style={{opacity:.6}}/>
      </button>
      {open && (
        <div style={{
          position:'absolute', top:'calc(100% + 6px)', left:0, minWidth:280,
          background:'#fff', color:'var(--ink-900)',
          border:'1px solid var(--ink-200)', borderRadius:12,
          boxShadow:'var(--shadow-lg)', overflow:'hidden', zIndex:25,
        }}>
          <div className="mono" style={{
            padding:'10px 14px', fontSize:11, letterSpacing:'.1em',
            textTransform:'uppercase', color:'var(--ink-500)',
            borderBottom:'1px solid var(--ink-100)',
          }}>Switch Games</div>
          {games.map((g, i) => {
            const active = g.id === current;
            return (
              <button key={g.id} onClick={() => { onChange(g.id); setOpen(false); }} style={{
                width:'100%', appearance:'none', border:0, cursor:'pointer',
                background: active ? 'var(--teal-50)' : 'transparent',
                textAlign:'left', padding:'12px 14px',
                display:'flex', alignItems:'center', gap:12,
                borderTop: i ? '1px solid var(--ink-100)' : 'none',
                fontFamily:'inherit',
              }}>
                <span style={{
                  width:34,height:34,borderRadius:8,
                  background:'var(--teal-50)',
                  display:'inline-flex',alignItems:'center',justifyContent:'center',
                  fontSize:18,
                }}>{g.flag}</span>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13.5,fontWeight:600}}>{g.name}</div>
                  <div style={{fontSize:11.5,color:'var(--ink-500)',marginTop:2}}>
                    {g.sub} · {g.host} · {g.window}
                  </div>
                </div>
                {active && <span style={{color:'var(--teal-700)'}}><Icon name="check" size={16}/></span>}
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const [gamesId, setGamesId] = React.useState('da26');
  const [role, setRole] = React.useState('hp');
  const [tab, setTab]   = React.useState('home');
  const [activeSection, setActiveSection] = React.useState(null);
  const [pinned, setPinned] = React.useState(['comp']);
  const [query, setQuery] = React.useState('');
  const [searchFocused, setSearchFocused] = React.useState(false);
  const [notifOpen, setNotifOpen] = React.useState(false);

  const games = GAMES.find(g => g.id === gamesId);
  const view = ALL_VIEWS[gamesId][role];
  const news = NEWS_BY_GAMES[gamesId];
  const activity = ACTIVITY_BY_GAMES[gamesId];
  const notifs = NOTIFS_BY_GAMES[gamesId];

  React.useEffect(() => { setActiveSection(view.sections[0].id); }, [role, gamesId]);

  const togglePin = id => setPinned(p => p.includes(id) ? p.filter(x=>x!==id) : [...p, id]);

  React.useEffect(() => {
    document.documentElement.style.setProperty('--gold-500', t.accent);
    document.documentElement.style.setProperty('--gold-50',
      t.accent + '24');
  }, [t.accent]);

  const tabs = [
    { id:'home', label:'Home' },
    { id:'sections', label:games.code },
    { id:'res',  label:'Resources' },
  ];

  return (
    <div style={{
      minHeight:'100vh',
      display:'flex', flexDirection:'column',
      fontSize: t.density === 'compact' ? 13.2 : t.density === 'comfy' ? 14.4 : 14,
    }}>
      <DemoBar roles={ROLES} current={role} onChange={setRole}/>
      <TopBar
        orgName="Australian Olympic Committee"
        portalName="Games Portal"
        user={{ name:'Robert Vergouw' }}
        notifCount={notifs.length}
        onNotifClick={() => setNotifOpen(true)}
        query={query}
        setQuery={setQuery}
        searchFocused={searchFocused}
        onSearchFocus={() => setSearchFocused(true)}
        onSearchBlur={() => setTimeout(() => setSearchFocused(false), 120)}
        gamesSwitcher={<GamesSwitcher games={GAMES} current={gamesId} onChange={setGamesId}/>}
      />
      <Tabs tabs={tabs} current={tab} onChange={setTab} badgeText={view.badgeText}/>

      <div style={{display:'flex',flex:1,minHeight:0,background:'var(--paper)'}}>
        <Sidebar
          view={view}
          gamesCode={games.code}
          activeId={activeSection}
          onPick={setActiveSection}
          pinned={pinned}
          onTogglePin={togglePin}
          density={t.density}
        />

        <main style={{flex:1,minWidth:0,overflow:'auto'}}>
          <Hero
            title={tab === 'home' ? games.name : tab === 'sections' ? `${games.code} Sections` : 'Resources Library'}
            subtitle={games.sub}
            breadcrumb={view.progressLabel}
            variant={t.heroVariant}
            flag={games.flag}
          />

          {tab === 'home' && (
            <>
              <KpiStrip view={view}/>
              <SectionGrid
                sections={view.sections}
                activeId={activeSection}
                onPick={setActiveSection}
              />

              <div style={{
                display:'grid',
                gridTemplateColumns: t.showActivity ? '1.4fr 1fr' : '1fr',
                gap:16, padding:'8px 28px 4px',
              }}>
                <NewsList items={news} currentRole={role}/>
                {t.showActivity && <ActivityFeed items={activity}/>}
              </div>

              {t.showShortcuts && <Shortcuts items={SHORTCUTS}/>}
            </>
          )}

          {tab !== 'home' && (
            <div style={{padding:'40px 28px',color:'var(--ink-500)'}}>
              <div style={{
                border:'1px dashed var(--ink-300)', borderRadius:14,
                padding:'48px 24px', textAlign:'center',
                background:'#fff',
              }}>
                <div className="mono" style={{
                  fontSize:11,letterSpacing:'.14em',textTransform:'uppercase',
                  color:'var(--ink-400)',marginBottom:8,
                }}>Placeholder</div>
                <div style={{fontSize:18,fontWeight:600,color:'var(--ink-700)'}}>
                  {tab === 'sections' ? `${games.code} — section detail` : 'Resources library'}
                </div>
                <div style={{marginTop:6,fontSize:13.5}}>
                  Home tab is the focus of this design. Click <strong>Home</strong> to return.
                </div>
              </div>
            </div>
          )}
        </main>
      </div>

      <NotificationPanel open={notifOpen} onClose={() => setNotifOpen(false)} items={notifs}/>

      <AskAOC
        gamesName={games.name}
        role={role}
        roleLabel={ROLES.find(r => r.id === role).label}
      />

      <TweaksPanel title="Tweaks">
        <TweakSection label="Theme"/>
        <TweakColor label="Accent" value={t.accent} onChange={v => setTweak('accent', v)}/>
        <TweakRadio label="Hero" value={t.heroVariant}
                    options={['minimal','gradient']}
                    onChange={v => setTweak('heroVariant', v)}/>
        <TweakSection label="Layout"/>
        <TweakRadio label="Density" value={t.density}
                    options={['compact','regular','comfy']}
                    onChange={v => setTweak('density', v)}/>
        <TweakToggle label="Show shortcuts" value={t.showShortcuts}
                     onChange={v => setTweak('showShortcuts', v)}/>
        <TweakToggle label="Show activity feed" value={t.showActivity}
                     onChange={v => setTweak('showActivity', v)}/>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
